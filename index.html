<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tecnicolor</title>
<style>
:root {
  --bg:#141414; --surface:#1e1e1e; --surface2:#262626; --border:#383838;
  --accent:#9b6dff; --accent2:#c4a8ff; --text:#f0f0f0; --text2:#888896;
  --success:#4caf7d; --radius:10px;
  --splash-bg:#141414;
}
html.light {
  --bg:#f5f5f2; --surface:#ffffff; --surface2:#eeeeea; --border:#d4d4ce;
  --accent:#7c3aed; --accent2:#6d28d9; --text:#1c1c1e; --text2:#65656f;
  --success:#2d9e5f; --splash-bg:#f5f5f2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:16.5px;transition:background .25s,color .25s}

/* ── Splash ─────────────────────────────────────────────── */
#splash{position:fixed;inset:0;z-index:1000;background:var(--splash-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;cursor:pointer;opacity:1;transition:opacity .7s ease;overflow:hidden}
#splash.fade-out{opacity:0;pointer-events:none}
.sp-portada{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:0;transition:opacity 1s ease .1s}
#splash.ready .sp-portada{opacity:1}
.sp-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.3) 50%,rgba(0,0,0,.5) 100%)}
.sp-logo{position:relative;z-index:2;height:110px;width:auto;margin-bottom:44px;opacity:0;transition:opacity .9s ease .2s;filter:drop-shadow(0 2px 16px rgba(0,0,0,.6))}
#splash.ready .sp-logo{opacity:1}
.sp-q{position:relative;z-index:2;max-width:580px;text-align:center;font-size:clamp(18px,3vw,28px);font-weight:300;line-height:1.6;color:#fff;font-style:italic;opacity:0;transform:translateY(16px);transition:opacity .9s ease .3s,transform .9s ease .3s;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#splash.ready .sp-q{opacity:1;transform:translateY(0)}
.sp-a{position:relative;z-index:2;margin-top:20px;font-size:11px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .9s ease .7s}
#splash.ready .sp-a{opacity:1}
.sp-hint{position:absolute;bottom:32px;z-index:2;font-size:11px;color:rgba(255,255,255,.4);opacity:0;transition:opacity .6s ease 1.3s}
#splash.ready .sp-hint{opacity:1}

/* ── Header ─────────────────────────────────────────────── */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-logo{display:flex;align-items:center;gap:12px}
.app-logo-img{height:44px;width:auto}
.app-logo-sub{font-size:11px;color:var(--text2);margin-top:1px}
.theme-btn{background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .15s;line-height:1}
.theme-btn:hover{background:var(--surface2)}
.header-right{display:flex;align-items:center;gap:8px}
.nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.nav-btn:hover{background:var(--border);color:var(--text)}

/* ── Screens ────────────────────────────────────────────── */
.screen{max-width:680px;margin:0 auto;padding:24px 16px 100px}

/* ── Selector ───────────────────────────────────────────── */
.search-wrap{position:relative;margin-bottom:24px}
.search-box{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color .2s}
.search-box:focus-within{border-color:var(--accent)}
.search-icon{font-size:18px;flex-shrink:0;opacity:.5}
.search-box input{flex:1;background:none;border:none;outline:none;font-size:15px;color:var(--text);font-family:inherit}
.search-box input::placeholder{color:var(--text2)}
.search-clear{background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px;padding:0 4px}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.search-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background .1s}
.search-item:hover{background:var(--surface2)}
.search-item+.search-item{border-top:1px solid var(--border)}
.search-item-icon{font-size:20px;flex-shrink:0}
.search-item-name{font-size:14px;font-weight:500;color:var(--text)}
.search-item-cat{font-size:11px;color:var(--text2);margin-top:2px}
.search-empty{padding:16px;text-align:center;color:var(--text2);font-size:13px}
.selector-hint{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text2);margin-bottom:12px}
/* ── CIE-10 ─────────────────────────────────────────────── */
.cie10-section{margin-bottom:20px}
.cie10-search-wrap{position:relative;margin-bottom:8px}
.cie10-search-box{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;transition:border-color .2s}
.cie10-search-box:focus-within{border-color:#3b82f6}
.cie10-search-box input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--text);font-family:inherit}
.cie10-search-box input::placeholder{color:var(--text2)}
#cie10-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.cie10-row{display:flex;align-items:baseline;gap:10px;padding:10px 14px;cursor:pointer;transition:background .1s}
.cie10-row:hover{background:var(--surface2)}
.cie10-row+.cie10-row{border-top:1px solid var(--border)}
.cie10-code{font-size:11px;font-weight:700;color:#3b82f6;flex-shrink:0;font-family:monospace;min-width:58px}
.cie10-desc{font-size:13px;color:var(--text)}
.cie10-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);padding:6px 10px;border-radius:8px;margin-top:4px}
.cie10-badge-code{font-size:12px;font-weight:700;color:#3b82f6;font-family:monospace}
.cie10-badge-desc{font-size:13px;color:var(--text)}
.cie10-clear{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 14px;cursor:pointer;text-align:left;transition:all .15s}
.cat-card:hover:not(.disabled){border-color:var(--accent);background:rgba(155,109,255,.08)}
.cat-card.disabled{opacity:.4;cursor:default}
.cat-icon{font-size:24px;display:block;margin-bottom:8px}
.cat-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px}
.cat-desc{font-size:11px;color:var(--text2);line-height:1.4}
.tech-cat-header{display:flex;align-items:center;gap:10px;padding:12px 0 16px;font-size:16px;font-weight:600}
.tech-list{display:flex;flex-direction:column;gap:8px}
.tech-btn{background:var(--surface);border:1.5px solid var(--border);color:var(--text);padding:14px 16px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px;font-weight:500;transition:all .15s}
.tech-btn:hover{border-color:var(--accent);background:rgba(155,109,255,.08);color:var(--accent2)}
.back-cat-btn{background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;padding:0 0 16px;display:flex;align-items:center;gap:6px}
.back-cat-btn:hover{color:var(--text)}

/* ── Form tech header ───────────────────────────────────── */
.form-tech-header{display:flex;align-items:center;gap:14px;padding:20px 0 4px;margin-bottom:12px}
.form-tech-icon{font-size:32px}
.form-tech-cat{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:3px}
.form-tech-name{font-size:20px;font-weight:700;color:var(--text)}

/* ── Sections ───────────────────────────────────────────── */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.section-header{padding:12px 18px;display:flex;align-items:center;gap:10px;background:var(--surface2);border-bottom:1px solid var(--border)}
.section-num{background:var(--accent);color:white;font-size:10px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em}
.section-body{padding:16px 18px}

/* ── Grids ──────────────────────────────────────────────── */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:7px}

/* ── Opt buttons ────────────────────────────────────────── */
.opt{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left;transition:all .15s;line-height:1.4;width:100%}
.opt:hover{border-color:var(--accent2);background:rgba(155,109,255,.08)}
.opt.sel{border-color:var(--accent);background:rgba(155,109,255,.18);color:var(--accent2)}
.opt .o-icon{font-size:17px;display:block;margin-bottom:4px}
.opt .o-label{font-size:13px;font-weight:600;display:block}
.opt .o-sub{font-size:11px;color:var(--text2);margin-top:2px;display:block}
.opt.sel .o-sub{color:rgba(196,168,255,.6)}

/* ── Tags ───────────────────────────────────────────────── */
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;user-select:none}
.tag:hover{border-color:var(--accent2);color:var(--text)}
.tag.sel{border-color:var(--accent);background:rgba(155,109,255,.18);color:var(--accent2)}
.nivel{background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);padding:5px 9px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;font-family:monospace;transition:all .15s;user-select:none}
.nivel:hover{border-color:var(--accent2);color:var(--text)}
.nivel.sel{border-color:var(--accent);background:rgba(155,109,255,.2);color:var(--accent2)}

/* ── Inputs ─────────────────────────────────────────────── */
input[type="text"],input[type="number"]{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;font-family:inherit;width:100%;transition:border-color .15s}
input:focus{outline:none;border-color:var(--accent)}
input::placeholder{color:var(--text2)}
textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:76px;transition:border-color .15s}
textarea:focus{outline:none;border-color:var(--accent)}
textarea::placeholder{color:var(--text2)}
.macro-area{min-height:130px;border-color:rgba(155,109,255,.3)!important;line-height:1.65}
.macro-hint{font-size:11px;color:var(--text2);margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn-regen{background:rgba(155,109,255,.15);border:1px solid rgba(155,109,255,.4);color:var(--accent2);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap;transition:all .15s}
.btn-regen:hover{background:rgba(155,109,255,.25)}

/* ── Toggle ─────────────────────────────────────────────── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
.toggle-label{font-size:13px}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:22px;cursor:pointer;transition:.2s}
.toggle-slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}

/* ── Sub-sections ───────────────────────────────────────── */
.sub{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.sub-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.sub-label-opt{font-weight:400;text-transform:none;letter-spacing:0}
.row{display:flex;gap:10px;align-items:flex-start}
.field{flex:1}
.field-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.div{height:1px;background:var(--border);margin:12px 0}
.mt1{margin-top:6px}.mt2{margin-top:10px}.mt3{margin-top:14px}

/* ── Spine diagram ──────────────────────────────────────── */
.spine-wrap{background:var(--surface2);border-radius:10px;padding:14px 10px;margin-top:4px;overflow-x:auto}
.spine-region-hdr{text-align:center;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:8px 0 4px;margin-top:4px}
.spine-region-hdr:first-child{margin-top:0}
.spine-region-hdr.rh-C{color:#60a5fa}
.spine-region-hdr.rh-T{color:#fbbf24}
.spine-region-hdr.rh-L{color:#34d399}
.spine-col-hdr{display:grid;grid-template-columns:1fr 90px 1fr;gap:4px;align-items:center;margin-bottom:6px}
.spine-col-hdr span{font-size:10px;color:var(--text2);text-align:center;font-weight:500}
.spine-col-hdr .col-l{text-align:right}
.spine-col-hdr .col-r{text-align:left}
.spine-row{display:grid;grid-template-columns:1fr 90px 1fr;gap:4px;align-items:center;margin-bottom:3px;position:relative}
.spine-row::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--border);transform:translateX(-50%);z-index:0;pointer-events:none}
.spine-center{position:relative;z-index:1;text-align:center;cursor:pointer;padding:3px 0}
.spine-center:hover .vert-lb{color:var(--text)}
.vert-lb{font-size:11px;font-weight:700;font-family:monospace;display:block;padding:3px 6px;border-radius:4px;border:1px solid var(--border);transition:all .15s}
.vert-nt{font-size:9px;display:block;margin-top:1px;letter-spacing:.03em;opacity:.7}
.spine-row[data-reg="C"] .vert-lb{color:#60a5fa;border-color:#3b82f660;background:rgba(59,130,246,.07)}
.spine-row[data-reg="T"] .vert-lb{color:#fbbf24;border-color:#f59e0b60;background:rgba(245,158,11,.07)}
.spine-row[data-reg="L"] .vert-lb{color:#34d399;border-color:#10b98160;background:rgba(16,185,129,.07)}
.spine-side{display:flex;justify-content:flex-end;z-index:1;position:relative}
.spine-side.r{justify-content:flex-start}
.bdot{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:var(--surface);cursor:pointer;transition:all .15s;user-select:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.bdot:hover{transform:scale(1.15)}
.bdot::after{content:'';transition:all .15s}
.bdot.sel::after{content:'⚡'}
.spine-row[data-reg="C"] .bdot.sel{background:#3b82f6;border-color:#3b82f6;box-shadow:0 0 10px rgba(59,130,246,.7)}
.spine-row[data-reg="T"] .bdot.sel{background:#f59e0b;border-color:#f59e0b;box-shadow:0 0 10px rgba(245,158,11,.7)}
.spine-row[data-reg="L"] .bdot.sel{background:#10b981;border-color:#10b981;box-shadow:0 0 10px rgba(16,185,129,.7)}
.spine-legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:11px;color:var(--text2)}
.spine-legend span{display:flex;align-items:center;gap:5px}
.legend-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:inline-block}
.legend-dot.c{background:#3b82f6;border-color:#3b82f6}
.legend-dot.t{background:#f59e0b;border-color:#f59e0b}
.legend-dot.l{background:#10b981;border-color:#10b981}

/* ── Region selector (multi) ────────────────────────────── */
.reg-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 10px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .18s;font-size:12px;font-weight:600;color:var(--text2);position:relative}
.reg-btn .rb-icon{font-size:22px;line-height:1}
.reg-btn .rb-ray{position:absolute;top:-8px;right:-6px;font-size:16px;opacity:0;transform:scale(.4) rotate(-20deg);transition:all .2s}
.reg-btn[data-reg="cerv"]{border-color:#3b82f6;color:#60a5fa}
.reg-btn[data-reg="tor"]{border-color:#f59e0b;color:#fbbf24}
.reg-btn[data-reg="lumb"]{border-color:#10b981;color:#34d399}
.reg-btn[data-reg="cerv"].sel{background:rgba(59,130,246,.22);box-shadow:0 0 12px rgba(59,130,246,.35)}
.reg-btn[data-reg="tor"].sel{background:rgba(245,158,11,.18);box-shadow:0 0 12px rgba(245,158,11,.35)}
.reg-btn[data-reg="lumb"].sel{background:rgba(16,185,129,.18);box-shadow:0 0 12px rgba(16,185,129,.35)}
.reg-btn.sel .rb-ray{opacity:1;transform:scale(1) rotate(0deg)}
.reg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}

/* ── Faceta big cards ───────────────────────────────────── */
.faceta-choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.faceta-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px;border-radius:14px;border:2px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .18s;text-align:center}
.faceta-card:hover{border-color:var(--accent);background:var(--surface);transform:translateY(-2px);box-shadow:0 6px 20px rgba(155,109,255,.2)}
.fc-icon{font-size:36px;line-height:1}
.fc-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:.02em}
.fc-desc{font-size:11px;color:var(--text2);line-height:1.4}
.faceta-card:first-child{border-color:rgba(76,175,125,.4)}
.faceta-card:first-child:hover{border-color:#4caf7d;box-shadow:0 6px 20px rgba(76,175,125,.2)}
.faceta-card:last-child{border-color:rgba(155,109,255,.4)}
.faceta-card:last-child:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(155,109,255,.25)}
.fc-img{width:90px;height:90px;object-fit:cover;object-position:center;border-radius:12px;margin-bottom:4px;flex-shrink:0;display:block}

/* ── Nivel epi diagram ──────────────────────────────────── */
.niv-epi-strip{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.niv-epi-sep{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:3px 6px;border-radius:4px;margin-top:5px}
.niv-epi-sep:first-child{margin-top:0}
.niv-C-sep{color:#60a5fa;background:rgba(59,130,246,.1)}
.niv-T-sep{color:#fbbf24;background:rgba(245,158,11,.1)}
.niv-L-sep{color:#34d399;background:rgba(16,185,129,.1)}
.niv-S-sep{color:#f87171;background:rgba(244,114,114,.1)}
.niv-epi-row{padding:3px 8px;border-radius:5px;border:1.5px solid transparent;font-size:11px;font-weight:600;font-family:monospace;cursor:pointer;transition:all .12s;color:var(--text2);user-select:none}
.niv-epi-row.niv-C{color:#93c5fd;background:rgba(59,130,246,.05)}
.niv-epi-row.niv-T{color:#fcd34d;background:rgba(245,158,11,.05)}
.niv-epi-row.niv-L{color:#6ee7b7;background:rgba(16,185,129,.05)}
.niv-epi-row.niv-S{color:#fca5a5;background:rgba(244,114,114,.05)}
.niv-epi-row:hover.niv-C{border-color:#3b82f660;background:rgba(59,130,246,.1)}
.niv-epi-row:hover.niv-T{border-color:#f59e0b60;background:rgba(245,158,11,.1)}
.niv-epi-row:hover.niv-L{border-color:#10b98160;background:rgba(16,185,129,.1)}
.niv-epi-row:hover.niv-S{border-color:#ef444460;background:rgba(244,114,114,.1)}
.niv-epi-row.sel.niv-C{background:#3b82f6;color:white;border-color:#3b82f6}
.niv-epi-row.sel.niv-T{background:#f59e0b;color:white;border-color:#f59e0b}
.niv-epi-row.sel.niv-L{background:#10b981;color:white;border-color:#10b981}

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'')}
function lev(a,b){
  if(!a.length)return b.length;if(!b.length)return a.length;
  const dp=Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++)dp[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[a.length][b.length];
}
function scoreMatch(query,t){
  const q=norm(query);
  const corpus=norm([t.name,...t.aliases].join(' '));
  let score=0;
  if(corpus.includes(q))score+=100;
  q.split(/\s+/).filter(w=>w.length>=2).forEach(word=>{
    if(corpus.includes(word)){score+=50;return;}
    corpus.split(/\s+/).forEach(cw=>{
      if(cw.length<2)return;
      const d=lev(word,cw);
      if(d===0)score+=60;else if(d===1)score+=35;else if(d===2&&word.length>=4)score+=15;
    });
  });
  return score;
}
function onSearch(query){
  const clear=document.getElementById('search-clear');
  const res=document.getElementById('search-results');
  clear.classList.toggle('hidden',!query);
  if(!query||query.trim().length<2){res.classList.add('hidden');return;}
  const matches=TECHNIQUES.map(t=>({...t,score:scoreMatch(query,t)})).filter(t=>t.score>0).sort((a,b)=>b.score-a.score).slice(0,6);
  if(!matches.length){res.innerHTML='<div class="search-empty">Sin resultados — prueba otra descripción</div>';}
  else{res.innerHTML=matches.map(t=>{const cat=CATEGORIES.find(c=>c.id===t.cat);return`<div class="search-item" onclick="selectTechnique('${t.id}')"><span class="search-item-icon">${cat?.icon||'·'}</span><div><div class="search-item-name">${t.name}</div><div class="search-item-cat">${cat?.name||t.cat}</div></div></div>`;}).join('');}
  res.classList.remove('hidden');
}

function natUbi(){return S.ubicacion?(S.ubicacion==='qx'?'en quirófano ':'en sala de técnicas '):''}
function natOpeningLine(){
  const pos = S.posicion || 'posición adecuada';
  const lugar = S.ubicacion ? (S.ubicacion==='qx'?'quirófano':'sala de técnicas') : 'sala';
  return `Paciente en ${pos}, en ${lugar}, bajo medidas de asepsia tras limpieza de zona a intervenir.`;
}
function natLat(prep){
  if(!S.lat)return '';
  const m={D:'en el lado derecho',I:'en el lado izquierdo',B:'bilateral'};
  return (prep?prep+' ':'')+m[S.lat];
}
function natNiveles(){
  if(!S.niveles.length)return '';
  const n=S.niveles;
  if(n.length===1)return `a nivel ${n[0]}`;
  return `a niveles ${n.slice(0,-1).join(', ')} y ${n[n.length-1]}`;
}
function natBranches(){
  if(!S.branches.size)return '';
  const groups={};
  for(const b of S.branches){const[lvl,side]=b.split('-');if(!groups[lvl])groups[lvl]=new Set();groups[lvl].add(side);}
  const sorted=SPINE_ORDER.filter(l=>groups[l]);
  const desc=sorted.map(lvl=>{
    const s=groups[lvl],lbl=BRANCH_LBL[lvl]||lvl;
    if(s.has('L')&&s.has('R'))return`${lbl} bilateral`;
    if(s.has('R'))return`${lbl} derecho`;
    return`${lbl} izquierdo`;
  });
  if(!desc.length)return '';
  if(desc.length===1)return desc[0];
  return desc.slice(0,-1).join(', ')+' y '+desc[desc.length-1];
}
function natBranchesReport(){
  // Separates special nerves (C2=GON, C3s=TON, C3p, L5=r.posterior)
  // from regular medial branches (C4–L4) for natural prose
  if(!S.branches.size)return '';
  const SPECIAL=new Set(['C2','C3s','C3p','L5']);
  const groups={};
  for(const b of S.branches){const[lvl,side]=b.split('-');if(!groups[lvl])groups[lvl]=new Set();groups[lvl].add(side);}
  const sorted=SPINE_ORDER.filter(l=>groups[l]);
  const fmt=(lvl)=>{
    const s=groups[lvl],lbl=BRANCH_LBL[lvl]||lvl;
    const lat=s.has('L')&&s.has('R')?'bilateral':s.has('R')?'derecho':'izquierdo';
    return`${lbl} ${lat}`;
  };
  const specials=sorted.filter(l=>SPECIAL.has(l)).map(fmt);
  const regulars=sorted.filter(l=>!SPECIAL.has(l)).map(fmt);
  const join=arr=>arr.length<=1?arr[0]||'':arr.slice(0,-1).join(', ')+' y '+arr[arr.length-1];
  const parts=[];
  if(specials.length)parts.push(join(specials));
  if(regulars.length)parts.push(`ramos mediales: ${join(regulars)}`);
  return parts.join('; ');
}
function natElectrodo(){
  const parts=[];
  if(S.rfLong)parts.push(`de ${S.rfLong} mm`);
  if(S.rfTip)parts.push(`punta activa de ${S.rfTip} mm`);
  return parts.length?'electrodos '+parts.join(', con '):'los electrodos de radiofrecuencia';
}
function natRFParams(){
  const p1=gv('rf-p1'),t=gv('rf-tiempo'),tandas=gv('rf-tandas');
  const parts=[];
  if(S.rfTipo==='Pulsada'){
    if(p1)parts.push(`a ${p1} V`);
    if(tandas&&t)parts.push(`en ${tandas} tandas de ${t} s`);
    else if(t)parts.push(`durante ${t} s por tanda`);
  } else {
    if(p1)parts.push(`a ${p1} °C`);
    if(t)parts.push(`durante ${t} s por punto`);
  }
  return parts.length?parts.join(', '):'';
}
function natTests(){
  const s=gv('rf-sens'),m=gv('rf-motor');
  const parts=[];
  if(s)parts.push(`test sensitivo a ${s} V`);
  if(m)parts.push(`test motor a ${m} V sin contracción muscular indeseada`);
  return parts.length?'Se realizan '+parts.join(' y ')+'. ':'';
}
function natAL(){
  const names=[...S.alList];const c=gv('al-custom');if(c)names.push(c);const v=gv('al-vol');
  if(!names.length&&!v)return'';
  return names.join(' + ')+(v?` (${v})`:'');
}
function natMezcla(){
  const al=natAL(),cort=S.cort&&S.cort!=='—'?S.cort:'';
  const parts=[al,cort].filter(Boolean);
  return parts.length?parts.join(' con '):'';
}
function natImagen(){
  const map={fluoroscopia:'control radioscópico',ecografia:'guía ecográfica'};
  const parts=(S.imagen||[]).map(x=>map[x]).filter(Boolean);
  if(!parts.length)return'control de imagen';
  return parts.length===1?parts[0]:parts.join(' y ');
}
function natATB(){
  if(!gc('chk-atb'))return'';
  const atb=[...gsel('[data-a="atb1"]')];const ao=gv('atb-otro');if(ao)atb.push(ao);
  if(!atb.length)return'Se administra profilaxis antibiótica. ';

}
function natResultado(){
  if(!S.resultado)return'';
  const eva=S.eva!=null?` EVA post-procedimiento inmediato: ${S.eva}/10.`:'';
  const comp=gv('comp-txt');
  switch(S.resultado){
    case 'sin-incidencias': return`Procedimiento realizado sin incidencias.${eva}`;
    case 'dolor-intra': return`Durante el procedimiento el paciente refirió dolor con tolerancia parcial${comp?`: ${comp}`:''}. Se adoptaron las medidas oportunas.${eva}`;
    case 'comp-menor': return`Incidencia menor durante el procedimiento${comp?`: ${comp}`:''}. Resuelta en sala sin complicaciones adicionales.${eva}`;
    case 'comp-mayor': return`Complicación mayor durante el procedimiento${comp?`: ${comp}`:''}. Requirió intervención adicional.${eva}`;
    default:return'';
  }
}

      const contrMl=gv('contr-ml');
      const contrTxt=contr?` mediante inyección de ${contrMl?contrMl+' mL de ':''}contraste radiológico bajo visión fluoroscópica, confirmando distribución epidural sin patrón vascular ni subaracnoideo`:'';
      let t=`${opening} ${atb}Bajo ${img}, se procede a infiltración epidural interlaminar`;
      if(niv) t+=` a nivel ${niv}`;
      t+=`. ${pielTxt}Se introduce aguja ${S.aguja||'de Tuohy'} y se avanza hasta el espacio epidural mediante técnica de pérdida de resistencia. Se confirma posición epidural${contrTxt}. Se administra ${mez||'la mezcla terapéutica'}. ${fin}`;
      return t;
    }
    case 'epi-parasagital':{
      const {pielTxt,mezcla:mez}=natMezclaEpi();
      const contrMl=gv('contr-ml');
      const contrTxt=contr?` con ${contrMl?contrMl+' mL de ':''}contraste radiológico, sin patrón vascular ni subaracnoideo`:'';
      let t=`${opening} ${atb}Bajo ${img}, se procede a infiltración epidural por abordaje parasagital`;
      if(latNiv) t+=` ${latNiv}`;
      t+=`. ${pielTxt}Con angulación lateral respecto a la línea media, se introduce aguja ${S.aguja||'de Tuohy'} hasta el espacio epidural mediante técnica de pérdida de resistencia, con distribución preferencial ipsilateral del fármaco. Se confirma posición epidural${contrTxt}. Se administra ${mez||'la mezcla terapéutica'}. ${fin}`;
      return t;
    }
    case 'epi-caudal':{
      const {pielTxt,mezcla:mez}=natMezclaEpi();
      const contrMl=gv('contr-ml');
      const contrTxt=contr?` con ${contrMl?contrMl+' mL de ':''}contraste radiológico, constatando distribución epidural sin patrón vascular ni subaracnoideo`:'';
      let t=`${opening} ${atb}Bajo guía ecográfica se identifica el hiato sacro y se confirma la localización correcta de la aguja ${S.aguja||'22G'} a través del ligamento sacrococcígeo hacia el canal sacro, con control fluoroscópico lateral complementario. Se confirma posición intracanalicular${contrTxt}. ${pielTxt}Se administra ${mez||'la mezcla terapéutica'}. ${fin}`;
      return t;
    }
    case 'epi-transforaminal':{
      const {pielTxt,mezcla:mez}=natMezclaEpi();
      const contrMl=gv('contr-ml');
      const contrTxt=contr?` mediante inyección de ${contrMl?contrMl+' mL de ':''}contraste, con distribución periradicular epidural y sin patrón vascular intravascular`:'';
      let t=`${opening} ${atb}Bajo ${img}, se realiza infiltración transforaminal`;
      if(latNiv) t+=` ${latNiv}`;
      t+=`. Se realiza secuencia fluoroscópica con proyección AP corregida, oblicua ipsilateral tipo "ojo de escopeta" para identificación del foramen diana, proyección lateral para profundidad de aguja y vuelta a AP para confirmación final. ${pielTxt}Se introduce aguja ${S.aguja||'22G punta recta'} hasta el cuadrante posterosuperior del foramen en zona de seguridad anatómica. Se confirma posición periradicular${contrTxt}. Se administra ${mez||'la mezcla terapéutica'}. ${fin}`;
      return t;
    }
    case 'epi-parche':{
      const contrMl=gv('contr-ml');
      const contrTxt=contr?` con ${contrMl?contrMl+' mL de ':''}contraste, verificando distribución epidural`:'';
      const vol=gv('parche-vol')||'hasta 20';
      let t=`${opening} ${atb}Bajo ${img}, se realiza parche hemático epidural`;
      if(niv) t+=` a nivel ${niv}`;
      t+=`. Previa anestesia local de piel y tejido celular subcutáneo, se introduce aguja de Tuohy hasta el espacio epidural mediante técnica de pérdida de resistencia. Se confirma posición epidural${contrTxt}. En condiciones de asepsia y esterilidad estrictas, se obtiene sangre autóloga del paciente por punción venosa y se inyectan ${vol} mL de forma lenta e incremental en el espacio epidural, deteniéndose ante dolor o resistencia. ${fin}`;
      return t;
    }
    case 'facetas-bloqueo':{
      const bm=mezcla||gv('blq-mezcla')||'la mezcla terapéutica';
      const bv=gv('blq-vol');
      const ramosDesc=natBranchesReport();
      const mezclaTxt=bv?`${bm} a razón de ${bv} ml por punto`:`${bm}`;
      let t=`${opening} ${atb}Realizamos bloqueo diagnóstico para valoración de probable origen facetario del dolor.`;
      t+=` Bajo ${img}, se infiltra en zona de paso de `;
      if(ramosDesc) t+=ramosDesc;
      else t+='los ramos seleccionados';
      t+=`, administrando ${mezclaTxt}.`;
      if(S.imagen&&S.imagen.includes('fluoroscopia')){
        t+=` Se descarta malposición de aguja mediante inyección de contraste radiológico, sin evidencia de distribución vascular ni subaracnoidea.`;
      }
      t+=` Se guardan imágenes del procedimiento. ${fin}`;
      return t;
    }
    case 'facetas-rf':{
      const natReg=(arr)=>{if(!arr.length)return'';if(arr.length===1)return arr[0];return arr.slice(0,-1).join(', ')+' y '+arr[arr.length-1];};
      const reg=natReg(S.facetReg);
      const modal=S.rfTipo?S.rfTipo.toLowerCase():'';
      const rfRamos=natBranchesReport();
      let t=`${opening} ${atb}Bajo ${img}, se realiza radiofrecuencia${modal?' '+modal:''} de ramos mediales${reg?' '+reg:''}`;
      if(rfRamos) t+=`, tratando: ${rfRamos}`;
      t+=`. Previa anestesia local, se posicionan ${electrodo} en la localización anatómica del ramo medial de cada nivel bajo visión fluoroscópica. `;
      if(tests) t+=tests;
      else t+=`Se realizan test de estimulación sensitiva y motora previo a la lesión, con respuesta adecuada. `;
      if(rfparams) t+=`Se procede a la lesión por radiofrecuencia ${rfparams} en cada electrodo. `;
      else t+=`Se procede a la lesión por radiofrecuencia según parámetros establecidos. `;
      t+=fin;
      return t;
    }
    case 'botox':{
      const ui=gv('botox-ui'),vol=gv('botox-vol'),punc=gv('botox-punc');
      const veh=document.querySelector('[data-a="tg1-veh"].sel')?.textContent||'';
      const sitio=gv('botox-sitio');
      let t=`${opening} ${atb}Se procede a la infiltración de toxina botulínica tipo A`;
      if(sitio) t+=` en ${sitio}`;
      t+='.';
      const d=[];
      if(ui) d.push(`dosis total de ${ui} UI`);
      if(veh) d.push(`diluida en ${veh.toLowerCase()}`);
      if(vol) d.push(`volumen total ${vol} mL`);
      if(punc) d.push(`distribuida en ${punc} puntos de inyección`);
      if(d.length) t+=` La toxina se administra con ${d.join(', ')}.`;
      t+=` Se informa al paciente del período de latencia esperado de 7-14 días hasta el inicio del efecto clínico. ${fin}`;
      return t;
    }
    case 'hombro-intraarticular':{
      const modImg=S.hombroMod==='rx'?'control radioscópico':S.hombroMod==='ambos'?'guía ecográfica y control radioscópico':'guía ecográfica';
      const needle=S.aguja||'22G';
      const contrStr=S.hombroMod!=='eco'&&gc('chk-contraste')?' Se inyecta contraste iodado confirmando patrón articular correcto.':'';
      const sustIntra=S.sustIntra;
      let sustTxt='';
      if(sustIntra==='prp'){
        const sistema=document.querySelector('[data-a="prp-sistema"].sel')?.dataset.v||'';
        const prpVol=gv('prp-vol'), pppVol=gv('ppp-vol');
        let extracccion=`Se extrae sangre autóloga del paciente en condiciones de asepsia y se centrifuga${sistema?' mediante sistema '+sistema:''} hasta obtener`;
        if(prpVol) extracccion+=` ${prpVol} mL de plasma rico en plaquetas (PRP)`;
        if(pppVol) extracccion+=`${prpVol?' y ':' '}${pppVol} mL de plasma pobre en plaquetas (PPP)`;
        extracccion+='. ';
        sustTxt=extracccion+(prpVol?`Se infiltra ${prpVol} mL de PRP intraarticular glenohumeral${lat?` ${lat}`:''}. `:'Se procede a la infiltración intraarticular de PRP. ');
        if(pppVol) sustTxt+=`Se reservan ${pppVol} mL de PPP para infiltración peritendinosa adicional si se precisa. `;
      } else if(sustIntra==='hialuronico'){
        const marca=gv('hia-marca'), vol=gv('hia-vol');
        sustTxt=`Se administra ácido hialurónico${marca?' ('+marca+')':''} intraarticular${vol?` (${vol} mL)`:''}. `;
      } else if(sustIntra==='alcort'){
        const alMg=gv('al-mg'), vehiculo=S.alVehiculo||'', alPrinc=S.alPrinc||'anestésico local', cort=S.cort&&S.cort!=='—'?S.cort:'';
        let mezcla=alPrinc+(alMg?` ${alMg} mg`:'');
        if(vehiculo) mezcla+=` en ${vehiculo}`;
        if(cort) mezcla+=` + ${cort}`;
        const volT=gv('al-voltotal');
        sustTxt=`Se administra ${mezcla}${volT?` (${volT} mL total)`:''} intraarticular. `;
      } else {
        const otro=gv('sust-otro-txt')||'la sustancia terapéutica';
        const vol=gv('sust-vol');
        sustTxt=`Se administra ${otro}${vol?` (${vol} mL)`:''}. `;
      }
      let t=`${opening} ${atb}Bajo ${modImg}, se realiza infiltración intraarticular glenohumeral${lat?` ${lat}`:''}. Se localiza el espacio glenohumeral y se accede con aguja ${needle} confirmando posición intraarticular.${contrStr} ${sustTxt}${fin}`;
      return t;
    }
    case 'hombro-tendinosa':{
      const selected=TENDONES_HOMBRO.filter(t=>S.tendones.has(t.id));
      const mezcla=natALHombro();
      if(!selected.length) return `${opening} ${atb}Bajo guía ecográfica, se procede a la infiltración de tendones y bursas del hombro${lat?` ${lat}`:''}. ${fin}`;
      // Construir listado de dianas con vol
      const partes=selected.map(t=>{
        const vol=document.querySelector(`.tend-vol[data-tend="${t.id}"]`)?.value?.trim();
        return `${t.prose}${vol?' ('+vol+' mL)':''}`;
      });
      // Lista larga → separar en puntos; lista corta → frase fluida
      const dianasTxt=partes.length===1?partes[0]:partes.slice(0,-1).join(', ')+' y '+partes[partes.length-1];
      // Abordaje detallado por diana
      const abordajes=selected.map(t=>`${t.label}: ${t.abordaje}`).join('; ');
      let t=`${opening} ${atb}Bajo guía ecográfica, se infiltran las siguientes estructuras del hombro${lat?` ${lat}`:''}`;
      t+=` con ${mezcla}: ${dianasTxt}. `;
      t+=`Abordaje de cada diana — ${abordajes}. `;
      t+=`Se verifica posición correcta de la aguja antes de cada inyección. ${fin}`;
      return t;
    }
    case 'hombro-nervios':{
      const hasSupra=S.nerviosHombro.has('supra');
      const hasCirc=S.nerviosHombro.has('circunflejo');
      const isRF=S.rfTipo;
      const sustN=gv('sust-nervios')||'la mezcla anestésica';
      const volS=gv('sust-vol');
      const volTxt=volS?` (${volS} mL)`:'';
      const nervNames=[];
      if(hasSupra) nervNames.push('nervio supraescapular');
      if(hasCirc) nervNames.push('nervio circunflejo (axilar)');
      const nervStr=nervNames.length?`del ${nervNames.join(' y del ')}`:'de nervios periarticulares del hombro';
      const tipoTrat=isRF?`radiofrecuencia ${S.rfTipo.toLowerCase()}`:'bloqueo';
      let t=`${opening} ${atb}Bajo guía ecográfica, con el paciente en decúbito lateral, se realiza ${tipoTrat} ${nervStr}${lat?` ${lat}`:''}. `;
      if(hasSupra){
        t+=`Nervio supraescapular: se posiciona el transductor sobre la foseta supraespinosa en eje largo y se localiza el nervio en el surco supraescapular, profundo al ligamento transverso superior de la escápula, medialmente a la escotadura. Abordaje en plano desde lateral. `;
        if(isRF) t+=`Se posiciona ${electrodo} en contacto perineural. `;
        else t+=`Se confirma posición perineural y se depositan${volTxt} de ${sustN}. `;
      }
      if(hasCirc){
        t+=`Nervio circunflejo (axilar): se identifica el espacio cuadrilátero posterior, delimitado por el redondo menor superiormente, el redondo mayor inferiormente, la cabeza larga del tríceps medialmente y el húmero lateralmente. Se localiza el nervio axilar junto a la arteria circunfleja humeral posterior. Abordaje en plano desde posteromedial. `;
        if(isRF) t+=`Se posiciona ${electrodo} en contacto perineural. `;
        else t+=`Se confirma posición perineural y se depositan${volTxt} de ${sustN}. `;
      }
      if(isRF){
        t+=tests||'Test sensitivo: parestesias concordantes en territorio glenohumeral y deltoides (>0,5 V). Test motor: ausencia de contracción del deltoides y manguito rotador (>1 V). ';
        if(rfparams) t+=`Se procede a la lesión por radiofrecuencia ${rfparams} en cada diana. `;
      }
      t+=fin; return t;
    }
    case 'hombro-capsular':{
      const ramasSelec=RAMAS_HOMBRO.filter(r=>S.ramasHombro.has(r.id));
      const mod=S.capsularMod||'rf-termica';
      const isCryo=mod==='crioablacion', isBlq=mod==='bloqueo';
      const modLabel=isCryo?'crioablación':isBlq?'bloqueo diagnóstico de ramos capsulares':`radiofrecuencia ${mod==='rf-pulsada'?'pulsada':'térmica'} de ramos capsulares`;
      const modo=S.rfMode==='bipolar'?'bipolar':'monopolar';
      const volS=gv('sust-vol');
      let t=`${opening} ${atb}Bajo guía ecográfica, se procede a ${modLabel} del hombro${lat?` ${lat}`:''}. `;
      if(ramasSelec.length){
        t+=`Se tratan las siguientes ramas: `;
        const ramDesc=ramasSelec.map(r=>`${r.label} (${r.abordaje})`).join('; ');
        t+=ramDesc+'. ';
      }
      if(isBlq){
        t+=`Se deposita anestésico local en cada receso capsular${volS?` (${volS} mL por punto)`:''}. `;
      } else if(isCryo){
        t+=`Se posiciona la criosonda sobre cada diana en contacto pericapsular. `;
        t+=tests||'Se verifican parestesias concordantes en territorio glenohumeral (test sensitivo) y ausencia de contracción de deltoides ni manguito rotador (test motor) previo al ciclo de congelación. ';
      } else {
        t+=`Procedimiento realizado en modalidad ${modo}. Se posiciona ${electrodo} sobre cada diana en contacto pericapsular. `;
        t+=tests||'Test sensitivo: respuesta concordante glenohumeral. Test motor: ausencia de contracción del deltoides y manguito rotador previo a la lesión. ';
        if(rfparams) t+=`Se procede a la lesión por radiofrecuencia ${rfparams} en cada electrodo. `;
      }
      t+=fin; return t;
    }
    case 'rodilla-intraarticular':
      return `${opening} ${atb}Bajo ${img}, se realiza infiltración intraarticular de rodilla${lat?`, ${lat}`:''}. Se accede al compartimento articular confirmando posición intraarticular de la aguja. Se administra ${S.sust||'la sustancia terapéutica'}${gv('sust-vol')?` (${gv('sust-vol')} mL)`:''}. ${fin}`;
    case 'rodilla-perirodilla':
      return `${opening} ${atb}Bajo ${img}, se realiza infiltración periarticular de rodilla${lat?`, ${lat}`:''}. Se identifican las estructuras periarticulares diana bajo visión ecográfica y se realizan las infiltraciones según pauta establecida. ${fin}`;
    case 'sacroiliaca-bloqueo':
      return `${opening} ${atb}Bajo ${img}, se realiza infiltración de la articulación sacroilíaca${lat?`, ${lat}`:''}. Se localiza la interlínea articular en su tercio inferior y se accede al interior articular. Se confirma posición${contr?` con contraste radiológico, con patrón articular característico`:''}. Se administra ${S.sust||'la mezcla terapéutica'}${gv('sust-vol')?` (${gv('sust-vol')} mL)`:''}. ${fin}`;
    case 'sacroiliaca-rf':
      return `${opening} ${atb}Bajo ${img}, se realiza radiofrecuencia${S.rfTipo?' '+S.rfTipo.toLowerCase():''} de la articulación sacroilíaca${lat?`, ${lat}`:''}. Se posicionan ${electrodo} a lo largo de la interlínea sacroilíaca posterior, cubriendo los ramos dorsales S1-S3. ${tests||'Tests de estimulación sensitiva y motora realizados. '}${rfparams?`Se procede a la lesión ${rfparams}. `:''}${fin}`;
    default:return opening;
  }
}
function regenMacro(){

  if(mt)mt.value=genMacro(TECH_ID);

function natMezclaEpi(){
  const piel=S.alPiel&&S.alPiel!=='Ninguna'?S.alPiel:null;
  const princ=S.alPrinc||'';
  const mg=gv('al-mg');
  const vehiculo=S.alVehiculo||'';
  const voltotal=gv('al-voltotal');
  const cort=S.cort&&S.cort!=='—'?S.cort:'';
  const pielTxt=piel?`Previa anestesia local superficial con ${piel}. `:'Previa anestesia local de piel y tejido celular subcutáneo. ';
  const parts=[];
  if(princ&&mg)parts.push(`${princ} ${mg} mg`);
  else if(princ)parts.push(princ);
  if(vehiculo)parts.push(`en ${vehiculo}`);
  if(voltotal)parts.push(`(${voltotal} mL volumen total)`);
  if(cort)parts.push(cort);
  return{pielTxt, mezcla:parts.join(', ')};
}

function buildNivelesEpi(lista){
  const getR=(n)=>n.startsWith('C')?'C':n.startsWith('T')?'T':n.startsWith('L')?'L':'S';
  let html='<div class="niv-epi-strip">';
  let lastR='';
  lista.forEach(n=>{
    const r=getR(n);
    if(r!==lastR){
      const labels={C:'Cervical',T:'Torácico',L:'Lumbar',S:'Sacro'};
      html+=`<div class="niv-epi-sep niv-${r}-sep">${labels[r]}</div>`;
      lastR=r;
    }
    const sel=S.niveles.includes(n)?'sel':'';
    html+=`<div class="niv-epi-row niv-${r} ${sel}" data-a="nivel-epi" data-v="${n}">${n}</div>`;
  });
  html+='</div>';
  return html;
}

// SPINE DIAGRAM BUILDER
// ════════════════════════════════════════════════════════════
function buildSpineDiagram(){
  const regions=[
    {r:'C',label:'Cervical',cls:'rh-C'},
    {r:'T',label:'Torácico',cls:'rh-T'},
    {r:'L',label:'Lumbar',  cls:'rh-L'},
  ];
  let html=`<div class="spine-wrap">`;
  html+=`<div class="spine-col-hdr"><span class="col-l">← Izq</span><span></span><span class="col-r">Der →</span></div>`;
  regions.forEach(reg=>{
    const levels=SPINE.filter(s=>s.r===reg.r);
    html+=`<div class="spine-region-hdr ${reg.cls}">${reg.label}</div>`;
    levels.forEach(s=>{
      const cL=S.branches.has(s.id+'-L')?'sel':'';
      const cR=S.branches.has(s.id+'-R')?'sel':'';
      const vertContent=s.showVert?`<span class="vert-lb">${s.lb||'·'}</span>`:`<span class="vert-lb" style="opacity:.35">·</span>`;
      const noteHtml=s.nt?`<span class="vert-nt">${s.nt}</span>`:'';
      html+=`<div class="spine-row" data-reg="${reg.r}">
        <div class="spine-side"><button class="bdot ${cL}" data-branch="${s.id}-L" title="${BRANCH_LBL[s.id]||s.id} — izquierdo"></button></div>
        <div class="spine-center" onclick="toggleBothBranches('${s.id}')" title="Clic: bilateral">${vertContent}${noteHtml}</div>
        <div class="spine-side r"><button class="bdot ${cR}" data-branch="${s.id}-R" title="${BRANCH_LBL[s.id]||s.id} — derecho"></button></div>
      </div>`;
    });
  });
  html+=`<div class="spine-legend"><span><span class="legend-dot c"></span>Cervical</span><span><span class="legend-dot t"></span>Torácico</span><span><span class="legend-dot l"></span>Lumbar</span><span style="font-size:10px">· clic etiqueta = bilateral</span></div>`;
  html+=`</div>`;
  return html;
}

function toggleBothBranches(lvl){
  const kL=lvl+'-L', kR=lvl+'-R';
  const bothSel=S.branches.has(kL)&&S.branches.has(kR);
  if(bothSel){S.branches.delete(kL);S.branches.delete(kR);}
  else{S.branches.add(kL);S.branches.add(kR);}
  refreshSpineDots();
  regenMacro();
}

function toggleBranch(key){
  if(S.branches.has(key))S.branches.delete(key);
  else S.branches.add(key);
  refreshSpineDots();
  regenMacro();
}

function refreshSpineDots(){
  document.querySelectorAll('.bdot').forEach(dot=>{
    const k=dot.dataset.branch;
    dot.classList.toggle('sel',S.branches.has(k));
  });
}

function natALHombro(){
  const al=AL_HOMBRO.find(a=>a.id===S.alHombro);
  if(!al) return 'la mezcla anestésica';
  let txt=al.label;
  if(S.alHombroConc) txt+=` ${S.alHombroConc}`;
  if(S.cort&&S.cort!=='Sin corticoide') txt+=` + ${S.cort}`;
  return txt;
}

function buildForm(id){
  const H=techHeader(id);
  const locEpi=(body)=>sec('Localización',body);
  switch(id){
    case 'epi-interlaminar':
      return H+BKDATOS+locEpi(buildNivelesEpi(NIVELES_EPI))+bkAgujaEpi('Tuohy')+bkImagenEpi(['fluoroscopia'])+BKALCORT_EPI+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'epi-parasagital':
      return H+BKDATOS+locEpi(bkLat()+buildNivelesEpi(NIVELES_EPI))+bkAgujaEpi('Tuohy')+bkImagenEpi(['fluoroscopia'])+BKALCORT_EPI+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'epi-transforaminal':
      return H+BKDATOS+locEpi(bkLat()+buildNivelesEpi(NIVELES_TF))+bkAgujaEpi('22G punta recta')+bkImagenEpi(['fluoroscopia'])+BKALCORT_EPI+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'epi-caudal':
      return H+BKDATOS+bkAgujaEpi('22G punta recta')+bkImagenEpi(['ecografia','fluoroscopia'])+BKALCORT_EPI+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'epi-parche':
      return H+BKDATOS+locEpi(buildNivelesEpi(NIVELES_EPI))+bkAgujaEpi('Tuohy')+bkImagenEpi(['fluoroscopia'])+
        sec('Parche hemático',`<div class="row"><div class="field"><div class="field-label">Volumen sangre autóloga (mL)</div><input type="number" id="parche-vol" value="15" max="20" step="1" oninput="regenMacro()"></div></div>`)+
        BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'facetas-bloqueo':
      return H+BKDATOS+BKFACETAS_REG+BKFACETAS_LOC+
        sec('Mezcla infiltrada',`<div class="row"><div class="field"><div class="field-label">Volumen por punto</div><input type="text" id="blq-vol" placeholder="p. ej. 1 mL" oninput="regenMacro()"></div><div class="field"><div class="field-label">Mezcla</div><input type="text" id="blq-mezcla" placeholder="AL + corticoide..." oninput="regenMacro()"></div></div>`)+
        BKIMAGEN+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'facetas-rf':
      return H+BKDATOS+BKFACETAS_REG+BKFACETAS_LOC+BKRF+BKIMAGEN+BKSED+BKRES+BKMACRO+BKNOTAS;

        sec('Infiltración',`
          <div class="field-label">Sitio de infiltración</div>

          <div class="row mt2">

            <div class="field"><div class="field-label">Volumen total (mL)</div><input type="number" id="botox-vol" placeholder="mL" step="0.1" oninput="regenMacro()"></div>

          </div>
          <div class="mt3"><div class="field-label">Vehículo</div><div class="tags mt1">
            <span class="tag" data-a="tg1-veh">Suero fisiológico</span>
            <span class="tag" data-a="tg1-veh">Anestésico local</span>
          </div></div>`)+
        BKRES+BKMACRO+BKNOTAS;
    case 'hombro-intraarticular':
      return H+BKDATOS+sec('Localización',bkLat()+bkHombroMod())+
        sec('Aguja',`<div class="tags mt1">
          <span class="nivel${S.aguja==='22G'||!S.aguja?' sel':''}" data-a="aguja" data-v="22G">22G</span>
          <span class="nivel${S.aguja==='20G'?' sel':''}" data-a="aguja" data-v="20G">20G</span>
          <span class="nivel${S.aguja==='18G'?' sel':''}" data-a="aguja" data-v="18G">18G</span>
        </div>`)+
        sec('Sustancia',`
          <div class="grid-2 mt1">
            <button class="opt" data-a="sust-intra" data-v="prp"><span class="o-icon">🩸</span><span class="o-label">PRP</span></button>
            <button class="opt" data-a="sust-intra" data-v="hialuronico"><span class="o-icon">💧</span><span class="o-label">Ácido hialurónico</span></button>
            <button class="opt" data-a="sust-intra" data-v="alcort"><span class="o-icon">💉</span><span class="o-label">AL + Corticoide</span></button>
            <button class="opt" data-a="sust-intra" data-v="otro"><span class="o-icon">✏️</span><span class="o-label">Otro</span></button>
          </div>
          <div id="blk-prp" class="hidden mt3">
            <div class="row">
              <div class="field"><div class="field-label">Volumen PRP (mL)</div><input type="number" id="prp-vol" placeholder="mL" step="0.5" oninput="regenMacro()"></div>
              <div class="field"><div class="field-label">Volumen PPP (mL)</div><input type="number" id="ppp-vol" placeholder="mL (si aplica)" step="0.5" oninput="regenMacro()"></div>
            </div>
            <div class="field-label mt2" style="font-size:11px;color:var(--text2)">Sistema · equipo de centrifugación</div>
            <div class="tags mt1">
              <span class="nivel" data-a="prp-sistema" data-v="BTI">BTI</span>
              <span class="nivel" data-a="prp-sistema" data-v="RegenKit">RegenKit</span>
              <span class="nivel" data-a="prp-sistema" data-v="Arthrex">Arthrex</span>
              <span class="nivel" data-a="prp-sistema" data-v="PRGF-Anitua">PRGF-Anitua</span>
            </div>
          </div>
          <div id="blk-hialuronico" class="hidden mt3">
            <div class="row">
              <div class="field"><div class="field-label">Marca / tipo</div><input type="text" id="hia-marca" placeholder="p.ej. Durolane, Synvisc..." oninput="regenMacro()"></div>
              <div class="field"><div class="field-label">Volumen (mL)</div><input type="number" id="hia-vol" placeholder="mL" step="0.5" oninput="regenMacro()"></div>
            </div>
          </div>
          <div id="blk-alcort" class="hidden mt3">${BKALCORT}</div>
          <div id="blk-sust-otro" class="hidden mt3">
            <input type="text" id="sust-otro-txt" placeholder="Describir sustancia..." oninput="regenMacro()">
            <div class="row mt2"><div class="field"><div class="field-label">Volumen (mL)</div><input type="text" id="sust-vol" placeholder="mL" oninput="regenMacro()"></div></div>
          </div>`)+
        BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'hombro-tendinosa':
      return H+BKDATOS+sec('Localización',bkLat())+bkTendinosHombro()+BKIMAGEN+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'hombro-nervios':
      return H+BKDATOS+sec('Localización',bkLat())+sec('Nervios y técnica',bkNerviosHombro())+BKRF+BKIMAGEN+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'hombro-capsular':
      return H+BKDATOS+sec('Localización',bkLat())+sec('Modalidad',bkCapsularMod())+bkRamasHombro()+
        sec('Modo electrodo',bkRfModo())+BKRF+sec('Sustancia / volumen',`<div class="row"><div class="field"><div class="field-label">Vol por punto (mL)</div><input type="text" id="sust-vol" placeholder="mL" oninput="regenMacro()"></div></div>`)+BKIMAGEN+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'rodilla-intraarticular':case 'rodilla-perirodilla':
      return H+BKDATOS+sec('Localización',bkLat())+BKSUST+BKIMAGEN+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'sacroiliaca-bloqueo':
      return H+BKDATOS+sec('Localización',bkLat())+BKSUST+BKIMAGEN+BKSED+BKRES+BKMACRO+BKNOTAS;
    case 'sacroiliaca-rf':
      return H+BKDATOS+sec('Localización',bkLat())+BKRF+BKIMAGEN+BKSED+BKRES+BKMACRO+BKNOTAS;
    default:
      return H+'<div class="section"><div class="section-body" style="padding:20px;color:var(--text2)">Formulario en construcción...</div></div>';
  }
}

// EVENT HANDLERS
// ════════════════════════════════════════════════════════════
function tog(id,on){document.getElementById(id)?.classList.toggle('hidden',!on)}

function initHandlers(){
  document.getElementById('form-container').addEventListener('click',e=>{
    // Branch dots
    const bdot=e.target.closest('.bdot');
    if(bdot){toggleBranch(bdot.dataset.branch);return;}

    const el=e.target.closest('[data-a]');
    if(!el)return;
    const a=el.dataset.a,v=el.dataset.v;

    if(a==='posicion'){
      S.posicion=v;
      el.closest('.tags').querySelectorAll('[data-a="posicion"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='ubicacion'){
      S.ubicacion=v;
      el.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='lat'){
      S.lat=v;
      el.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='nivel'){
      el.classList.toggle('sel');
      if(el.classList.contains('sel')){if(!S.niveles.includes(v))S.niveles.push(v);}
      else S.niveles=S.niveles.filter(n=>n!==v);
      regenMacro();
    }
    else if(a==='imagen'){
      el.classList.toggle('sel');
      if(el.classList.contains('sel')){if(!S.imagen.includes(v))S.imagen.push(v);}
      else S.imagen=S.imagen.filter(x=>x!==v);
      regenMacro();
    }
    else if(a==='al'){
      el.classList.toggle('sel');
      if(el.classList.contains('sel')){if(!S.alList.includes(v))S.alList.push(v);}
      else S.alList=S.alList.filter(x=>x!==v);
      regenMacro();
    }
    else if(a==='cort'){
      S.cort=v;
      document.querySelectorAll('[data-a="cort"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='rftype'){
      S.rfTipo=v;
      el.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      const lbl=document.getElementById('lbl-p1');
      const p1=document.getElementById('rf-p1');
      const t=document.getElementById('rf-tiempo');
      const tandas=document.getElementById('blk-tandas');
      if(v==='Pulsada'){
        if(lbl)lbl.textContent='Voltaje (V)';
        if(p1&&!p1.dataset.usr)p1.value='45';
        if(t&&!t.dataset.usr)t.value='120';
        if(tandas)tandas.classList.remove('hidden');
      } else {
        if(lbl)lbl.textContent='Temperatura (°C)';
        if(p1&&!p1.dataset.usr)p1.value='80';
        if(t&&!t.dataset.usr)t.value='90';
        if(tandas)tandas.classList.add('hidden');
      }
      regenMacro();
    }
    else if(a==='rflong'){
      S.rfLong=v;
      el.parentElement.querySelectorAll('.nivel').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='rftip'){
      S.rfTip=v;
      el.parentElement.querySelectorAll('.nivel').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='resultado'){
      S.resultado=v;
      document.querySelectorAll('[data-a="resultado"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      document.getElementById('blk-comp')?.classList.toggle('hidden',!v.includes('comp'));
    }
    else if(a==='eva'){
      S.eva=v;
      document.querySelectorAll('[data-a="eva"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
    }
    else if(a==='atb1'){
      el.closest('.tags').querySelectorAll('[data-a="atb1"]').forEach(t=>t.classList.remove('sel'));
      el.classList.add('sel');
    }
    else if(a==='tgtog'){el.classList.toggle('sel');}
    else if(a==='tg1-veh'){
      el.closest('.tags').querySelectorAll('[data-a="tg1-veh"]').forEach(t=>t.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='facetReg'){
      el.classList.toggle('sel');
      if(el.classList.contains('sel')){if(!S.facetReg.includes(v))S.facetReg.push(v);}
      else S.facetReg=S.facetReg.filter(x=>x!==v);
      regenMacro();
    }
    else if(a==='rama-hombro'){
      el.classList.toggle('sel');
      if(el.classList.contains('sel'))S.ramasHombro.add(v);
      else S.ramasHombro.delete(v);
      regenMacro();
    }
    else if(a==='tend-hombro'){
      if(e.target.tagName==='INPUT'||e.target.tagName==='LABEL')return;
      el.classList.toggle('sel');
      const vi=el.querySelector('.tend-vol-inline');
      if(vi) vi.style.display=el.classList.contains('sel')?'flex':'none';
      if(el.classList.contains('sel'))S.tendones.add(v);
      else S.tendones.delete(v);
      regenMacro();
    }
    else if(a==='nervio-hombro'){
      el.classList.toggle('sel');
      if(el.classList.contains('sel'))S.nerviosHombro.add(v);
      else S.nerviosHombro.delete(v);
      regenMacro();
    }
    else if(a==='nervios-trat'){
      el.closest('.tags').querySelectorAll('[data-a="nervios-trat"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      const isRF=(v==='rf');
      S.rfTipo=isRF?'Pulsada':null;
      tog('blk-nervios-rf',isRF);
      tog('blk-nervios-sust',!isRF);
      if(isRF){
        const p1=document.getElementById('rf-p1');if(p1)p1.value='45';
        const t=document.getElementById('rf-tiempo');if(t)t.value='120';
        document.querySelector('[data-a="rftype"][data-v="Pulsada"]')?.classList.add('sel');
        document.getElementById('blk-tandas')?.classList.remove('hidden');
      }
      regenMacro();
    }
    else if(a==='capsular-mod'){
      S.capsularMod=v;
      el.closest('.grid-2').querySelectorAll('[data-a="capsular-mod"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      const showRF=(v==='rf-termica'||v==='rf-pulsada');
      const rfSec=document.getElementById('blk-capsular-rf');
      if(rfSec) rfSec.style.display=showRF?'':'none';
      if(v==='rf-pulsada'){
        S.rfTipo='Pulsada';
        document.querySelector('[data-a="rftype"][data-v="Pulsada"]')?.classList.add('sel');
        document.querySelector('[data-a="rftype"][data-v="Térmica"]')?.classList.remove('sel');
        const p1=document.getElementById('rf-p1');if(p1)p1.value='45';
        const t=document.getElementById('rf-tiempo');if(t)t.value='120';
        document.getElementById('blk-tandas')?.classList.remove('hidden');
      } else if(v==='rf-termica'){
        S.rfTipo='Térmica';
        document.querySelector('[data-a="rftype"][data-v="Térmica"]')?.classList.add('sel');
        document.querySelector('[data-a="rftype"][data-v="Pulsada"]')?.classList.remove('sel');
        const p1=document.getElementById('rf-p1');if(p1)p1.value='80';
        const t=document.getElementById('rf-tiempo');if(t)t.value='60';
        document.getElementById('blk-tandas')?.classList.add('hidden');
      } else {
        S.rfTipo=null;
      }
      regenMacro();
    }
    else if(a==='hombro-mod'){
      S.hombroMod=v;
      el.closest('.tags').querySelectorAll('[data-a="hombro-mod"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      tog('blk-hombro-contraste',(v==='rx'||v==='ambos'));
      regenMacro();
    }
    else if(a==='al-hombro'){
      S.alHombro=v; S.alHombroConc=null;
      el.closest('.tags').querySelectorAll('[data-a="al-hombro"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      // Reconstruir concentraciones
      const blk=document.getElementById('blk-al-conc');
      if(blk){
        const concs=AL_HOMBRO.find(a=>a.id===v)?.concs||[];
        blk.querySelector('.tags').innerHTML=concs.map(c=>`<span class="nivel" data-a="al-hombro-conc" data-v="${c}">${c}</span>`).join('');
        blk.classList.remove('hidden');
      }
      regenMacro();
    }
    else if(a==='al-hombro-conc'){
      S.alHombroConc=v;
      el.closest('.tags').querySelectorAll('[data-a="al-hombro-conc"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='sust-intra'){
      S.sustIntra=v;
      el.closest('.grid-2').querySelectorAll('[data-a="sust-intra"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      tog('blk-prp',v==='prp');
      tog('blk-hialuronico',v==='hialuronico');
      tog('blk-alcort',v==='alcort');
      tog('blk-sust-otro',v==='otro');
      regenMacro();
    }
    else if(a==='prp-sistema'){
      S.prpSistema=v;
      el.closest('.tags').querySelectorAll('[data-a="prp-sistema"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='rfmode'){
      S.rfMode=v;
      el.closest('.tags').querySelectorAll('[data-a="rfmode"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='nivel-epi'){
      el.classList.toggle('sel');
      if(el.classList.contains('sel')){if(!S.niveles.includes(v))S.niveles.push(v);}
      else S.niveles=S.niveles.filter(n=>n!==v);
      regenMacro();
    }
    else if(a==='aguja'){
      S.aguja=v;
      el.closest('.tags').querySelectorAll('[data-a="aguja"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='al-piel'){
      S.alPiel=v;
      el.closest('.tags').querySelectorAll('[data-a="al-piel"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='al-princ'){
      S.alPrinc=v;
      el.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='al-vehiculo'){
      S.alVehiculo=v;
      el.closest('.tags').querySelectorAll('[data-a="al-vehiculo"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      regenMacro();
    }
    else if(a==='sust'){
      S.sust=v;
      document.querySelectorAll('[data-a="sust"]').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      document.getElementById('blk-sust-alcort')?.classList.toggle('hidden',!['AL + corticoide','Anestésico local'].includes(v));
      regenMacro();
    }
  });
}

const IMG_L={fluoroscopia:'fluoroscopia / Rx',ecografia:'ecografía',ninguna:'sin guía de imagen'};

const gv=id=>(document.getElementById(id)?.value||'').trim();
const gc=id=>document.getElementById(id)?.checked||false;
const gsel=sel=>Array.from(document.querySelectorAll(sel)).filter(e=>e.classList.contains('sel')).map(e=>e.textContent.trim());

function generarInforme(){
  const lines=[];const add=s=>lines.push(s);const br=()=>lines.push('');

  // Diagnóstico CIE-10 (si se seleccionó)
  if(S_CIE.code){add(`Diagnóstico: ${S_CIE.code} · ${S_CIE.desc}`);br();}

  // Texto clínico directo
  const macro=gv('macro-txt');
  if(macro) add(macro);

  // Sedación (si aplica), integrada al final del bloque narrativo
  if(gc('chk-sed')){
    const drugs=[];
    document.querySelectorAll('.sed-dose-input').forEach(inp=>{
      const dose=inp.value.trim();
      if(dose)drugs.push(`${inp.dataset.drug} ${dose} ${inp.dataset.unit}`);
    });
    const so=gv('sed-obs');
    let sed='Se realizó sedación / analgesia procedimental';
    if(drugs.length)sed+=` con ${drugs.join(', ')}`;
    if(so)sed+=`. ${so}`;
    br();add(sed+'.');
  }

  // Resultado e incidencias en lenguaje natural
  const res=natResultado();
  if(res){br();add(res);}

  // Notas libres
  const obs=gv('obs-txt');
  if(obs){br();add(obs);}

  document.getElementById('report-out').value=lines.join('\n');
  document.getElementById('overlay').classList.remove('hidden');
}

function closeModal(){document.getElementById('overlay').classList.add('hidden');}
function copyReport(){
  navigator.clipboard.writeText(document.getElementById('report-out').value).then(()=>{
    const t=document.getElementById('toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);
  });
}

function normCIE(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').trim();}

function searchCIE10(q){
  if(!q||q.length<2) return[];
  const nq=normCIE(q);
  const words=nq.split(/\s+/).filter(w=>w.length>=2);
  const results=CIE10.filter(e=>e.c!=='_placeholder').map(e=>{
    const haystack=normCIE([e.d,...e.a].join(' '));
    let score=0;
    if(haystack.includes(nq)) score+=200;
    words.forEach(w=>{
      if(haystack.includes(w)) score+=60;
      else{
        haystack.split(/\s+/).forEach(hw=>{
          if(hw.length<2)return;
          const dist=lev(w,hw);
          if(dist===0)score+=60;
          else if(dist===1&&w.length>=4)score+=30;
          else if(dist===2&&w.length>=5)score+=10;
        });
      }
    });
    return{...e,score};
  });
  return results.filter(e=>e.score>0).sort((a,b)=>b.score-a.score).slice(0,8);
}

function onCIE10Search(q){
  const res=document.getElementById('cie10-results');
  if(!q||q.length<2){res.classList.add('hidden');return;}
  const matches=searchCIE10(q);
  if(!matches.length){res.innerHTML='<div class="search-empty">Sin resultados — prueba otro término</div>';res.classList.remove('hidden');return;}
  res.innerHTML=matches.map(e=>`<div class="cie10-row" onclick="selectCIE10('${e.c}','${e.d.replace(/'/g,'&apos;')}')">
    <span class="cie10-code">${e.c}</span>
    <span class="cie10-desc">${e.d}</span>
  </div>`).join('');
  res.classList.remove('hidden');
}

function selectCIE10(code, desc){
  S_CIE={code, desc};
  document.getElementById('cie10-input').value='';
  document.getElementById('cie10-results').classList.add('hidden');
  renderCIE10Badge();
}

function clearCIE10(){
  S_CIE={code:null,desc:null};
  renderCIE10Badge();
}

function renderCIE10Badge(){
  const wrap=document.getElementById('cie10-badge-wrap');
  if(!wrap)return;
  if(S_CIE.code){
    wrap.innerHTML=`<div class="cie10-badge"><span class="cie10-badge-code">${S_CIE.code}</span><span class="cie10-badge-desc">${S_CIE.desc}</span><button class="cie10-clear" onclick="clearCIE10()">✕</button></div>`;
  } else {
    wrap.innerHTML='';
  }
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
// ── Tema claro/oscuro ────────────────────────────────────────
function applyTheme(mode){
  document.documentElement.classList.toggle('light', mode==='light');
  const btn=document.getElementById('theme-btn');
  if(btn) btn.textContent = mode==='light' ? '☀️' : '🌙';
}
function toggleTheme(){
  const isLight=document.documentElement.classList.contains('light');
  const newMode=isLight?'dark':'light';
  localStorage.setItem('tc-theme',newMode);
  applyTheme(newMode);
}
// Aplica tema guardado o preferencia del sistema
(function(){
  const saved=localStorage.getItem('tc-theme');
  const prefersDark=window.matchMedia?.('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark?'dark':'light'));
})();

initSplash();
</script>
