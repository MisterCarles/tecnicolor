          style="font-size:11px;color:#6b7280;border:none;border-bottom:1px solid #e5e7eb;outline:none;background:transparent;width:78px;text-align:right;font-family:inherit;padding-bottom:1px">
        <button onclick="txClearSlot('${s.uid}')"
          style="background:#fee2e2;border:2px solid #fca5a5;color:#dc2626;cursor:pointer;border-radius:6px;font-size:13px;font-weight:900;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;transition:all .15s"
          onmouseover="this.style.background='#dc2626';this.style.borderColor='#dc2626';this.style.color='#fff'"
          onmouseout="this.style.background='#fee2e2';this.style.borderColor='#fca5a5';this.style.color='#dc2626'">✕</button>
      </div>

      <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding-left:22px;margin-bottom:6px">
        <span onclick="txSetSlotMode('${s.uid}','std')"
          style="font-size:10px;padding:2px 8px;border-radius:8px;cursor:pointer;font-weight:600;border:1px solid ${isStd?'#166534':'#e5e7eb'};background:${isStd?'#166534':'transparent'};color:${isStd?'#fff':'#9ca3af'}">☀️ · 🌤️ · 🌙</span>
        <span onclick="txSetSlotMode('${s.uid}','custom')"
          style="font-size:10px;padding:2px 8px;border-radius:8px;cursor:pointer;font-weight:600;border:1px solid ${s.mode==='custom'?'#166534':'#e5e7eb'};background:${s.mode==='custom'?'#166534':'transparent'};color:${s.mode==='custom'?'#fff':'#9ca3af'}">Texto libre</span>
        <span onclick="txSetSlotMode('${s.uid}','rescue')"
          style="font-size:10px;padding:2px 8px;border-radius:8px;cursor:pointer;font-weight:600;border:1px solid ${s.mode==='rescue'?'#b45309':'#e5e7eb'};background:${s.mode==='rescue'?'#b45309':'transparent'};color:${s.mode==='rescue'?'#fff':'#9ca3af'}">🆘 Si dolor</span>
      </div>

      ${isStd?`
      <div style="display:flex;align-items:flex-end;gap:6px;padding-left:22px;margin-bottom:6px;flex-wrap:wrap">
        <div style="display:flex;align-items:flex-end;gap:4px">
          <div style="text-align:center">
            <div style="font-size:9px;color:#f59e0b;font-weight:700;margin-bottom:2px">☀️ MAÑANA</div>
            <input value="${s.m}" oninput="txSlotField('${s.uid}','m',this.value)"
              style="width:42px;text-align:center;border:2px solid #fde68a;border-radius:6px;padding:5px 2px;font-size:15px;font-weight:800;outline:none;font-family:inherit;color:#b45309;background:#fffbeb">
          </div>
          <div style="color:#d1d5db;font-size:20px;font-weight:200;margin-bottom:5px;line-height:1">—</div>
          <div style="text-align:center">
            <div style="font-size:9px;color:#0ea5e9;font-weight:700;margin-bottom:2px">🌤️ MEDIODÍA</div>
            <input value="${s.nn}" oninput="txSlotField('${s.uid}','nn',this.value)"
              style="width:42px;text-align:center;border:2px solid #bae6fd;border-radius:6px;padding:5px 2px;font-size:15px;font-weight:800;outline:none;font-family:inherit;color:#0369a1;background:#f0f9ff">
          </div>
          <div style="color:#d1d5db;font-size:20px;font-weight:200;margin-bottom:5px;line-height:1">—</div>
          <div style="text-align:center">
            <div style="font-size:9px;color:#818cf8;font-weight:700;margin-bottom:2px">🌙 NOCHE</div>
            <input value="${s.no}" oninput="txSlotField('${s.uid}','no',this.value)"
              style="width:42px;text-align:center;border:2px solid #c7d2fe;border-radius:6px;padding:5px 2px;font-size:15px;font-weight:800;outline:none;font-family:inherit;color:#4338ca;background:#eef2ff">
          </div>
        </div>
        <div style="display:flex;gap:3px;flex-wrap:wrap;padding-bottom:2px">${qBtns}</div>
      </div>`
      :s.mode==='rescue'?`<div style="padding-left:22px;margin-bottom:6px;display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;color:#b45309;font-weight:600">A demanda si dolor · máx.</span>
        <input value="${s.rescueMax||'3'}" oninput="txSlotField('${s.uid}','rescueMax',this.value)"
          style="width:36px;text-align:center;border:2px solid #fed7aa;border-radius:6px;padding:4px 2px;font-size:14px;font-weight:800;outline:none;font-family:inherit;color:#b45309;background:#fff7ed">
        <span style="font-size:11px;color:#b45309;font-weight:600">tomas/día · separadas ≥8h</span>
      </div>`
      :`<div style="padding-left:22px;margin-bottom:6px">
        <input value="${s.custom.replace(/"/g,'&quot;')}" oninput="txSlotField('${s.uid}','custom',this.value)" placeholder="Ej: 30 mg/día primera semana, luego 20 mg/día…"
          style="width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:6px 10px;font-size:12px;outline:none;font-family:inherit;color:#374151;background:#fff;box-sizing:border-box">
      </div>`}

      <div style="padding-left:22px;margin-top:4px">
        <input placeholder="Observaciones…" value="${(s.notes||'').replace(/"/g,'&quot;')}" oninput="txSlotField('${s.uid}','notes',this.value)" placeholder="Observaciones (tomar con alimentos, evitar alcohol…)"
          style="width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:5px 9px;font-size:12px;color:#374151;outline:none;font-family:inherit;background:#fff;box-sizing:border-box"
          onfocus="this.style.borderColor='#166534'" onblur="this.style.borderColor='#e5e7eb'">
      </div>
    </div>`;
  }).join('');
}

function txDropOnSlot(uid){
  if(!txDragMedId)return;
  const slot=TX_SLOTS.find(s=>s.uid===uid);
  if(slot)txFillSlot(slot,txDragMedId);
  txDragMedId=null;txRenderSlots();txRenderPalette();
}
function txClearSlot(uid){
  const s=TX_SLOTS.find(x=>x.uid===uid);
  if(s){s.med=null;s.name='';s.dose='';s.m='';s.nn='';s.no='';s.custom='';s.notes='';s.rescueMax='3';s.mode='std';}
  txRenderSlots();txRenderPalette();
}
function txSlotField(uid,field,val){const s=TX_SLOTS.find(x=>x.uid===uid);if(s)s[field]=val;}
function txSetSlotMode(uid,mode){const s=TX_SLOTS.find(x=>x.uid===uid);if(s){s.mode=mode;txRenderSlots();}}
function txSetSlotSched(uid,m,nn,no){const s=TX_SLOTS.find(x=>x.uid===uid);if(s){s.m=m;s.nn=nn;s.no=no;txRenderSlots();}}

function txOpenSlotEditor(uid){
  // Abre un mini modal para añadir fármaco a mano o buscar en el slot
  const existing=document.getElementById('tx-slot-modal');
  if(existing)existing.remove();
  const modal=document.createElement('div');
  modal.id='tx-slot-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML=`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 60px #0006">
    <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px">Añadir fármaco al slot ${uid}</div>
    <input id="tx-slot-search" type="text" placeholder="Buscar o escribir nombre..." autocomplete="off"
      style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);background:var(--surface);outline:none;box-sizing:border-box;font-family:inherit">
    <div id="tx-slot-results" style="margin-top:8px;max-height:260px;overflow-y:auto;border-radius:8px;border:1px solid var(--border);display:none"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button onclick="txConfirmSlotManual('${uid}')"
        style="flex:1;padding:9px;background:#166534;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">✓ Añadir</button>
      <button onclick="document.getElementById('tx-slot-modal').remove()"
        style="padding:9px 16px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;font-size:13px;cursor:pointer">Cancelar</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
  const inp=modal.querySelector('#tx-slot-search');
  inp.focus();
  const res=modal.querySelector('#tx-slot-results');
  inp.oninput=()=>{
    const q=inp.value.trim();
    const nq=txNorm(q);
    const matches=q?TX_MEDS.filter(m=>txNorm(m.n).includes(nq)||txNorm(m.d).includes(nq)).slice(0,10):TX_MEDS.slice(0,20);
    if(!matches.length){res.style.display='none';return;}
    res.innerHTML=matches.map(m=>{
      const cat=TX_CATS.find(c=>c.id===m.cat);
      return`<div onmousedown="txFillSlotFromModal('${uid}','${m.id}')"
        style="padding:9px 13px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)"
        onmouseover="this.style.background='rgba(22,101,52,.08)'" onmouseout="this.style.background='transparent'">
        <span style="font-weight:600;color:var(--text)">${m.n}</span>
        <span style="color:${cat?cat.color:'#9ca3af'};font-size:11px">${m.d}</span>
      </div>`;
    }).join('');
    res.style.display='block';
  };
  inp.oninput(); // mostrar lista inicial
}
function txFillSlotFromModal(uid,medId){
  const slot=TX_SLOTS.find(s=>s.uid===uid);
  if(slot)txFillSlot(slot,medId);
  txRenderSlots();txRenderPalette();
  const modal=document.getElementById('tx-slot-modal');
  if(modal)modal.remove();
}
function txConfirmSlotManual(uid){
  const inp=document.getElementById('tx-slot-search');
  if(!inp)return;
  const name=inp.value.trim();
  if(!name)return;
  const slot=TX_SLOTS.find(s=>s.uid===uid);
  if(slot){slot.name=name;slot.dose='';slot.m='1';slot.nn='0';slot.no='1';slot.mode='std';}
  txRenderSlots();txRenderPalette();
  document.getElementById('tx-slot-modal').remove();
}

function txSearch(q){
  const dd=document.getElementById('tx-dropdown');
  if(!q.trim()){
    // mostrar todos agrupados por categoría cuando el campo está vacío
    const cats=TX_CATS;
    dd.innerHTML=cats.map(cat=>{
      const meds=TX_MEDS.filter(m=>m.cat===cat.id);
      if(!meds.length)return'';
      return`<div style="padding:5px 12px 2px;font-size:10px;font-weight:700;color:${cat.color};text-transform:uppercase;letter-spacing:.06em;background:var(--surface2);border-bottom:1px solid var(--border)">${cat.label}</div>`
        +meds.map(m=>`<div class="tx-dd-item" onmousedown="txAddMedToNextSlot('${m.id}');document.getElementById('tx-search').value='';document.getElementById('tx-dropdown').style.display='none'">
          <span style="font-weight:600;color:var(--text)">${m.n}</span><span style="color:${cat.color};font-size:11px;margin-left:auto">${m.d}</span>
        </div>`).join('');
    }).join('');
    dd.style.display='block';
    return;
  }
  const nq=txNorm(q);
  const res=TX_MEDS.filter(m=>txNorm(m.n).includes(nq)||txNorm(m.d).includes(nq)).slice(0,12);
  if(!res.length){dd.innerHTML='<div style="padding:10px 14px;font-size:12px;color:#9ca3af">Sin resultados</div>';dd.style.display='block';return;}
  dd.innerHTML=res.map(m=>{
    const cat=TX_CATS.find(c=>c.id===m.cat);
    return`<div class="tx-dd-item" onmousedown="txAddMedToNextSlot('${m.id}');document.getElementById('tx-search').value='';document.getElementById('tx-dropdown').style.display='none'">
      <span style="font-weight:600;color:var(--text)">${m.n}</span>
      <span style="color:${cat?cat.color:'#9ca3af'};font-size:11px;margin-left:auto">${m.d}</span>
    </div>`;
  }).join('');
  dd.style.display='block';
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#tx-search')&&!e.target.closest('#tx-dropdown')){const dd=document.getElementById('tx-dropdown');if(dd)dd.style.display='none';}
});

function txFormatSched(s){
  if(s.mode==='custom')return s.custom;
  return`${s.m||'0'} – ${s.nn||'0'} – ${s.no||'0'}`;
}

function txLongDate(){
  const d=new Date();
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return`${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}

function txPrint(){
  const pac=document.getElementById('tx-paciente')?.value||'';
  const diag=document.getElementById('tx-diag')?.value||'';
  const rows=TX_SLOTS.filter(s=>s.name.trim());
  const doc=TX_DOCTORS.find(d=>d.id===txActiveDoctorId)||TX_DOCTORS[0];

  const tableRows=rows.map((s,i)=>{
    const isStd=s.mode==='std';
    const isRescue=s.mode==='rescue';
    const posCells=isStd
      ?`<td style="text-align:center;font-size:17px;font-weight:800;color:#b45309;background:#fffbeb;width:54px">${s.m||'0'}</td>
         <td style="text-align:center;font-size:17px;font-weight:800;color:#0369a1;background:#f0f9ff;width:54px">${s.nn||'0'}</td>
         <td style="text-align:center;font-size:17px;font-weight:800;color:#4338ca;background:#eef2ff;width:54px">${s.no||'0'}</td>`
      :isRescue
      ?`<td colspan="3" style="font-size:11px;color:#b45309;font-weight:600;padding:8px 10px">🆘 A demanda si dolor · máx. ${s.rescueMax||'3'} tomas/día (separadas ≥8h)</td>`
      :`<td colspan="3" style="font-size:11px;color:#374151;font-style:italic;padding:8px 10px">${s.custom}</td>`;
    const notesCell=s.notes?`<td style="font-size:10px;color:#6b7280;font-style:italic;max-width:120px">${s.notes}</td>`:`<td></td>`;
    return`<tr>
      <td style="text-align:center;color:#d1d5db;font-weight:700;font-size:11px;width:24px">${i+1}</td>
      <td style="padding:10px"><strong style="font-size:15px;display:block;font-family:'Calibri','Candara',Georgia,serif">${s.name}</strong><span style="font-size:11px;color:#6b7280">${s.dose}</span></td>
      ${posCells}
      ${notesCell}
    </tr>`;
  }).join('');

  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pauta de tratamiento</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Calibri','Candara',Georgia,serif;font-size:12px;color:#111;padding:16mm 20mm;position:relative}
.wm{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-35deg);opacity:0.05;width:75%;z-index:0;pointer-events:none}
.c{position:relative;z-index:1}
table{width:100%;border-collapse:collapse;margin-top:4px}
th{padding:7px 10px;font-size:9px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;border-top:1px solid #e5e7eb;border-bottom:2px solid #166534;background:#f9fafb;font-family:Arial,sans-serif}
th.pos{text-align:center;width:54px;padding:7px 4px}
td{padding:8px 10px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
tr:last-child td{border-bottom:none}
@media print{body{padding:12mm 16mm}}
</style></head><body>
<img class="wm" src="${TX_LOGO}">
<div class="c">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:12px;margin-bottom:18px;border-bottom:2.5px solid #166534">
    <img src="${TX_LOGO}" style="height:50px;object-fit:contain">
    <div style="text-align:right">
      <div style="font-size:12px;color:#374151;font-style:italic">Valencia, a ${txLongDate()}</div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:${diag?'1fr 1fr':'1fr'};gap:16px;margin-bottom:18px">
    <div>
      <div style="font-size:20px;font-weight:800;font-family:'Calibri','Candara',Georgia,serif;color:#111">${pac||'_________________________'}</div>
      
    </div>
    ${diag?`<div>
      <div style="font-size:9px;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-family:Arial,sans-serif">Diagnóstico / Motivo</div>
      <div style="font-size:13px">${diag}</div>
    </div>`:''}
  </div>
  <table>
    <thead><tr>
      <th></th>
      <th>Fármaco</th>
      <th class="pos">☀️<br>Mañana</th>
      <th class="pos">🌤️<br>Mediodía</th>
      <th class="pos">🌙<br>Noche</th>
      <th style="font-size:9px">Observaciones</th>
    </tr></thead>
    <tbody>${tableRows}</tbody>
  </table>
  ${doc&&doc.name?`<div style="margin-top:36px;display:flex;justify-content:flex-end;align-items:flex-end;gap:20px">
    <div style="text-align:center;min-width:200px;border-top:1.5px solid #d1d5db;padding-top:10px;position:relative">

      ${doc.id==='d1'?`<img src="${TX_SELLO}" style="position:absolute;top:-60px;left:50%;transform:translateX(-50%) rotate(-5deg);width:120px;height:120px;opacity:0.18;mix-blend-mode:multiply;pointer-events:none">`:''}      <div style="position:relative;font-size:12px;font-weight:700">${doc.name}</div>
      ${doc.spec?`<div style="position:relative;font-size:10px;color:#6b7280">${doc.spec}</div>`:''}
      ${doc.col?`<div style="position:relative;font-size:10px;color:#6b7280">Col. nº ${doc.col}</div>`:''}
    </div>
  </div>`:''}
</div>
<script>window.onload=()=>{window.print();window.onafterprint=()=>window.close();}<\/script>
</body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(!w){alert('Permite ventanas emergentes para imprimir el PDF.');URL.revokeObjectURL(url);}
  else{setTimeout(()=>URL.revokeObjectURL(url),60000);}
}

function txEmail(){
  const pac=document.getElementById('tx-paciente')?.value||'Paciente';
  const doc=TX_DOCTORS.find(d=>d.id===txActiveDoctorId)||TX_DOCTORS[0];
  const farmacos=TX_SLOTS.filter(s=>s.name.trim()).map(s=>s.name).join(', ');
  const subject=encodeURIComponent(`Pauta de tratamiento — ${pac}`);
  const body=encodeURIComponent(`Estimado/a paciente,\n\nAdjunto encontrará su pauta de tratamiento.\n\nFármacos prescritos: ${farmacos}\n\nSaludos,\n${doc.name}`);
  txPrint();
  setTimeout(()=>window.location.href=`mailto:?subject=${subject}&body=${body}`,800);
}

function txBorrarTodo(){
  if(!confirm('¿Borrar toda la pauta?'))return;
  TX_SLOTS=Array.from({length:8},(_,i)=>({uid:'s'+i,med:null,name:'',dose:'',m:'',nn:'',no:'',custom:'',notes:'',rescueMax:'3',mode:'std'}));
  document.getElementById('tx-paciente').value='';
  document.getElementById('tx-diag').value='';
  txRenderSlots();txRenderPalette();
}

function txNueva(){
  if(TX_SLOTS.some(s=>s.name.trim())&&!confirm('¿Nueva pauta? Se borrarán los datos actuales.'))return;
  TX_SLOTS=Array.from({length:8},(_,i)=>({uid:'s'+i,med:null,name:'',dose:'',m:'',nn:'',no:'',custom:'',notes:'',rescueMax:'3',mode:'std'}));
  document.getElementById('tx-paciente').value='';
  document.getElementById('tx-fecha').value=txTodayStr();
  document.getElementById('tx-diag').value='';
  txRenderSlots();txRenderPalette();
}


</script>
</body>
</html>
